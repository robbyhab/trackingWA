<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konsultasi Paket Umroh</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a7b5c">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f4f7f6;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#17211e}
main{width:100%;max-width:420px;background:#fff;border-radius:16px;padding:28px 22px;box-shadow:0 2px 16px rgba(0,0,0,.07)}
h1{margin:0 0 6px;font-size:22px;line-height:1.25}
.s{margin:0 0 20px;color:#52615c}
label{display:block;margin:0 0 14px;font-size:14px;font-weight:600}
label span{font-weight:400;color:#7a8a85}
input{display:block;width:100%;margin-top:6px;padding:13px 12px;font:inherit;font-size:16px;border:1px solid #c9d4d0;border-radius:10px;background:#fff}
input:focus{outline:2px solid #0a7b5c;border-color:transparent}
button{width:100%;padding:14px;margin-top:4px;font:inherit;font-weight:700;color:#fff;background:#0a7b5c;border:0;border-radius:10px;cursor:pointer}
button:disabled{opacity:.7;cursor:wait}
#e{min-height:20px;margin:0 0 8px;font-size:14px;color:#b3261e}
small{display:block;margin-top:14px;font-size:12px;line-height:1.45;color:#7a8a85}
.h{position:absolute;left:-9999px}
</style>
</head>
<body>
<main>
<h1>Konsultasi Paket Umroh</h1>
<p class="s">Isi nomor WhatsApp Anda, lalu lanjut chat dengan tim kami.</p>
<form id="f" novalidate>
<label>Nama <span>(opsional)</span><input id="n" name="name" autocomplete="name" maxlength="80"></label>
<label>Nomor WhatsApp<input id="p" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0812 3456 7890" required></label>
<input class="h" id="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<p id="e" role="alert"></p>
<button id="b" type="submit">Chat Sekarang</button>
</form>
<small>Dengan menekan tombol, Anda setuju nama dan nomor Anda kami simpan untuk keperluan konsultasi.</small>
</main>
<script>
(function(){
/* ===== PENGATURAN: edit bagian ini saja ===== */
var C={
  WA:"6285237415647",                              /* nomor WA bisnis, format 62..., tanpa + */
  MSG:"Halo kak, saya mau konsultasi paket umroh.",    /* teks awal chat */
  PIXEL:"",                                        /* Meta Pixel ID; kosongkan = tanpa pixel */
  API:"/api/lead",
  WAIT:1500                                        /* maks. ms menunggu data tersimpan sebelum buka WA */
};
/* ============================================ */
var T0=Date.now(),Q=new URLSearchParams(location.search);
function $(i){return document.getElementById(i)}
function ck(n){var m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));return m?decodeURIComponent(m[1]):""}
function norm(raw){
  var d=String(raw||"").replace(/\D/g,"");
  if(d.slice(0,2)==="00")d=d.slice(2);
  if(d.slice(0,3)==="620")d="62"+d.slice(3);
  else if(d.charAt(0)==="0")d="62"+d.slice(1);
  else if(d.charAt(0)==="8")d="62"+d;
  if(d.slice(0,2)==="62")return /^628\d{8,12}$/.test(d)?d:"";
  return /^\d{10,15}$/.test(d)?d:"";
}
function code(){var a="ABCDEFGHJKMNPQRSTUVWXYZ23456789",s="",i;for(i=0;i<5;i++)s+=a.charAt(Math.floor(Math.random()*a.length));return s}

$("f").addEventListener("submit",function(e){
  e.preventDefault();
  if($("hp").value)return;
  var ph=norm($("p").value),er=$("e");
  if(!ph){er.textContent="Nomor WhatsApp belum sesuai. Contoh: 0812 3456 7890";$("p").focus();return}
  er.textContent="";
  var b=$("b");b.disabled=true;b.textContent="Membuka WhatsApp…";
  var ref=code(),eid="ld_"+ref+"_"+T0,fb=Q.get("fbclid")||"";
  var d={
    name:$("n").value,phone:ph,ref:ref,event_id:eid,fbclid:fb,
    fbc:ck("_fbc")||(fb?"fb.1."+T0+"."+fb:""),fbp:ck("_fbp"),
    utm:{source:Q.get("utm_source")||"",medium:Q.get("utm_medium")||"",campaign:Q.get("utm_campaign")||"",content:Q.get("utm_content")||"",term:Q.get("utm_term")||""}
  };
  if(window.fbq)fbq("track","Lead",{},{eventID:eid});
  var done=false;
  function go(){
    if(done)return;done=true;
    location.href="https://wa.me/"+C.WA+"?text="+encodeURIComponent(C.MSG+" (Ref: "+ref+")");
  }
  setTimeout(go,C.WAIT);
  try{
    fetch(C.API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d),keepalive:true}).then(go,go);
  }catch(x){go()}
});

if(C.PIXEL)addEventListener("load",function(){
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
  fbq("init",C.PIXEL);fbq("track","PageView");
});
})();
</script>
</body>
</html>
